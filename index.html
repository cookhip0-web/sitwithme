<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#EAE8E2"><title>sit with me. — a space to pause</title>
<link rel="stylesheet" href="style.css"></head>
<body><div class="grain"></div><div class="cursor-light" id="cursorLight"></div>
<header><a class="brand" href="#home">sit with me.</a><div class="nav-wrap"><nav class="nav" aria-label="Main navigation"><a href="#look">Look</a><a href="#reflect">Write</a><a href="#notes">Notes</a></nav></div></header>
<main><section class="hero wrap" id="home"><div class="hero-copy"><h1>Sit with<br>me.</h1><p class="hero-idea">A pause to share space, notice the city, and be here together.</p><a class="begin" href="#look"><span class="breath"></span> Look →</a></div><figure class="hero-photo"><img src="images/sit17.JPG" alt="People sitting together on a park bench"></figure></section>
<section class="section" id="look"><div class="wrap"><div class="section-head"><h2>The city around us</h2><div class="photo-add"><button class="plain" id="addPhotos" type="button">＋ Add photos</button><input id="photoFiles" type="file" accept="image/*" multiple hidden><span id="photoUploadStatus" aria-live="polite"></span></div></div><div class="photo-grid" id="photoGrid"></div></div></section>
<section class="section" id="reflect"><div class="wrap"><div class="section-head"><h2>A moment to notice</h2></div><div class="reflect-layout"><div><p class="prompt" id="prompt"></p><textarea id="thoughtInput" aria-label="Write a thought" placeholder="Write…"></textarea><div class="controls"><button id="anotherQ">Another question</button><button id="saveThought">Save</button><button id="clearThought">Clear</button></div><p class="saved-msg" id="savedMsg"></p></div></div></div></section>
<section class="section" id="notes"><div class="wrap"><div class="section-head"><h2>What we keep</h2></div><div class="notes-summary"><strong id="thoughtCount">0 notes</strong><strong id="photoCount">0 photos</strong></div><div class="note-tools"><div class="filters" id="filters"><button class="active" data-filter="ALL">All</button><button data-filter="REFLECT">Write</button><button data-filter="LOOK">Photos</button></div><div class="note-actions-bar"><input type="search" id="searchNotes" placeholder="Search" aria-label="Search notes"><button class="plain" id="arrangeNotes" type="button">Arrange</button></div></div><div class="note-list" id="noteList"></div></div></section></main>
<div class="gallery-modal" id="galleryModal" role="dialog" aria-modal="true" aria-label="Photograph"><button class="modal-close" id="closeGallery">Close ×</button><img id="modalImg" alt=""><aside><span class="label" id="modalNo"></span><h3 id="modalTitle"></h3><p id="modalCaption"></p><p class="label" id="modalPlace"></p><div class="modal-controls"><button id="prevPhoto">← Previous</button><button id="nextPhoto">Next →</button></div><button class="plain" id="modalSave">Bookmark ♧</button><details class="photo-reflection"><summary>Write about this photo</summary><label for="thoughtBefore">What are you carrying?</label><textarea id="thoughtBefore" placeholder="Just write what feels true."></textarea><label for="thoughtAfter">What else might be true?</label><textarea id="thoughtAfter" placeholder="No need to force a positive answer."></textarea><button class="plain" id="savePhotoReflection">Save to Notes</button><p class="saved-msg" id="photoSavedMsg" aria-live="polite"></p></details></aside></div>
<div class="note-modal" id="noteModal"><div class="note-reader"><button class="modal-close" id="closeNote">Close ×</button><span class="label" id="readerMeta"></span><h2 id="readerTitle"></h2><p id="readerBody"></p></div></div>
<button class="edge-theme-toggle" id="themeToggle" type="button" aria-label="Turn the lights off" aria-pressed="false" title="Light switch"><span class="theme-icon" aria-hidden="true">☼</span></button>
<script src="script.js"></script></body></html>
